name: bite
description: "Bite: a swipe-based news reader. Stage-1 frontend mockup."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_card_swiper: ^7.2.0
  cupertino_icons: ^1.0.8
  liquid_glass_renderer: ^0.2.0-dev.4
  animations: ^2.2.0
  flutter_dotenv: ^6.0.1
  webview_flutter: ^4.14.0
  share_plus: ^13.2.0
  url_launcher: ^6.3.2
  supabase_flutter: ^2.15.4
  sign_in_with_apple: ^8.1.0
  # Cover art is fetched straight from publisher CDNs. Image.network caches in
  # memory only, so every relaunch — and every card that fell out of the memory
  # cache — re-downloaded the same photo from the publisher. Disk caching is
  # both a performance fix and basic courtesy to a source we are asking to host
  # our images for free.
  cached_network_image: ^3.4.1
  # Appearance preference, stored locally so it survives a relaunch and works
  # for guests with no account and no network.
  shared_preferences: ^2.3.3
  crypto: ^3.0.7
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Test-only: lets flow_test register an inert WebViewPlatform. Since Phase
  # 15.1 every story opens in the in-app browser, so any end-to-end test builds
  # a WebViewController, and `flutter test` has no platform implementation.
  webview_flutter_platform_interface: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - .env
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
